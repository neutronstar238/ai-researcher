name: ai-researcher

services:
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: ai-researcher:local
    command: ["doctor"]
    env_file:
      - deploy/docker/.env.example
    environment:
      AUTORESEARCH_PROJECT_ROOT: /workspace
      AUTORESEARCH_VAULT_PATH: /workspace/autoresearch-vault
      AUTORESEARCH_RUNS_PATH: /workspace/runs
      AUTORESEARCH_ARTIFACTS_PATH: /workspace/artifacts
    volumes:
      - autoresearch-vault:/workspace/autoresearch-vault
      - autoresearch-runs:/workspace/runs
      - autoresearch-artifacts:/workspace/artifacts

  postgres:
    image: postgres:16-alpine
    profiles:
      - database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoresearch}
      POSTGRES_USER: ${POSTGRES_USER:-autoresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoresearch-dev-password}
    volumes:
      - autoresearch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  autoresearch-artifacts:
  autoresearch-postgres:
  autoresearch-runs:
  autoresearch-vault:
