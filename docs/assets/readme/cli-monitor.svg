<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">AI-Researcher operator console</title>
  <desc id="desc">A terminal-style screenshot of the AI-Researcher monitor command showing agent messages, active agents, information flow, approvals, changes, and output previews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151d"/>
      <stop offset="55%" stop-color="#18202b"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <style>
      .title { font: 700 28px Consolas, "Liberation Mono", monospace; fill: #e7edf5; }
      .sub { font: 400 14px Consolas, "Liberation Mono", monospace; fill: #8fa1b7; }
      .panel-title { font: 700 15px Consolas, "Liberation Mono", monospace; fill: #e7edf5; }
      .text { font: 400 13px Consolas, "Liberation Mono", monospace; fill: #cfd8e3; }
      .muted { font: 400 12px Consolas, "Liberation Mono", monospace; fill: #8495aa; }
      .ok { fill: #58d68d; }
      .warn { fill: #ffd166; }
      .fail { fill: #ff7b72; }
      .cyan { stroke: #58c7f3; }
      .green { stroke: #58d68d; }
      .magenta { stroke: #c77dff; }
      .yellow { stroke: #ffd166; }
      .red { stroke: #ff7b72; }
      .blue { stroke: #70a5ff; }
      .panel { fill: rgba(8, 12, 18, 0.72); stroke-width: 1.5; rx: 8; }
    </style>
  </defs>
  <rect width="1280" height="780" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="732" rx="14" fill="#080d14" stroke="#2d3b4f" stroke-width="1.5"/>
  <circle cx="56" cy="52" r="7" fill="#ff6b6b"/>
  <circle cx="80" cy="52" r="7" fill="#ffd166"/>
  <circle cx="104" cy="52" r="7" fill="#58d68d"/>
  <text x="132" y="61" class="title">AI-Researcher Operator Console</text>
  <text x="132" y="86" class="sub">airesearcher monitor -- watch agents, queues, flow, diffs, and publication outputs</text>

  <rect x="52" y="112" width="562" height="180" class="panel cyan"/>
  <text x="74" y="140" class="panel-title">Agent Messages</text>
  <text x="74" y="166" class="text">2026-06-15 - Codex - Task 119.1 V1.0 release readiness</text>
  <text x="74" y="188" class="muted">Request: final Git cleanup, daily fetch, inspiration push, README.</text>
  <text x="74" y="212" class="text">2026-06-15 - Codex - Task 118.1 paper artifact quality</text>
  <text x="74" y="234" class="muted">Summary: references fixed, figures/tables added, PDFs passed gates.</text>
  <text x="74" y="258" class="ok">Verification: ruff, mypy, pytest, live cycle artifacts</text>

  <rect x="666" y="112" width="562" height="180" class="panel green"/>
  <text x="688" y="140" class="panel-title">Active Agents</text>
  <text x="688" y="168" class="text">agent              task                    status      paths</text>
  <line x1="688" y1="180" x2="1198" y2="180" stroke="#334258"/>
  <text x="688" y="204" class="text">Literature Agent   daily-refresh           ready       vault/cache</text>
  <text x="688" y="228" class="text">Experiment Agent   public-benchmark        idle        runs/</text>
  <text x="688" y="252" class="text">Review Agent       evidence-gate           watching    outputs/</text>

  <rect x="52" y="318" width="562" height="190" class="panel magenta"/>
  <text x="74" y="346" class="panel-title">Information Flow</text>
  <text x="74" y="374" class="text">source discovery    <tspan class="ok">pass</tspan>       arXiv + OpenAlex</text>
  <text x="74" y="398" class="text">inspiration         <tspan class="ok">ready</tspan>      Hugging Face + HN</text>
  <text x="74" y="422" class="text">similarity check    <tspan class="ok">findings</tspan>   source-backed</text>
  <text x="74" y="446" class="text">experiment          <tspan class="ok">run</tspan>        public benchmark</text>
  <text x="74" y="470" class="text">paper build         <tspan class="ok">compiled</tspan>   outputs/project.pdf</text>

  <rect x="666" y="318" width="562" height="190" class="panel yellow"/>
  <text x="688" y="346" class="panel-title">Approvals and Tasks</text>
  <text x="688" y="374" class="text">kind        id                         status      detail</text>
  <line x1="688" y1="386" x2="1198" y2="386" stroke="#334258"/>
  <text x="688" y="410" class="text">approval    latest                     pending     dangerous run</text>
  <text x="688" y="434" class="text">task        issue-follow-up            open        missing evidence</text>
  <text x="688" y="458" class="text">push        feishu                     sent        inspiration digest</text>
  <text x="688" y="482" class="text">push        wechat                     skipped     webhook not set</text>

  <rect x="52" y="534" width="562" height="170" class="panel red"/>
  <text x="74" y="562" class="panel-title">Changes</text>
  <text x="74" y="590" class="text">M src/autoresearch/cli/main.py</text>
  <text x="74" y="614" class="text">A src/autoresearch/notifications.py</text>
  <text x="74" y="638" class="text">M README.md / README.zh-CN.md</text>
  <text x="74" y="662" class="muted">Diff preview can be disabled with --no-diff for clean monitoring.</text>

  <rect x="666" y="534" width="562" height="170" class="panel blue"/>
  <text x="688" y="562" class="panel-title">Preview Results</text>
  <text x="688" y="590" class="text">cycle-summary.json        evidence graph and metrics</text>
  <text x="688" y="614" class="text">publication-audit.json    pass / needs_revision</text>
  <text x="688" y="638" class="text">paper-build.json          LaTeX quality report</text>
  <text x="688" y="662" class="text">project-cycle.pdf         publishable artifact candidate</text>
</svg>
