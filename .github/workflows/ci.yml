name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airesearcher
          POSTGRES_PASSWORD: airesearcher
          POSTGRES_DB: airesearcher
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airesearcher"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests
      - name: Secret scan
        working-directory: backend
        run: python scripts/scan_secrets.py
      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy app
      - name: Unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://airesearcher:airesearcher@localhost:5432/airesearcher
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/unit -q
      # 集成测试需要 MinIO/Neo4j/Milvus/etcd，由 compose 启动（spec §22.3）
      - name: Start heavy dependencies
        run: docker compose up -d minio neo4j etcd milvus
      - name: Integration tests
        working-directory: backend
        run: pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start full stack
        run: docker compose up -d postgres redis minio neo4j etcd milvus
      - name: Install backend deps + migrate + seed
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          alembic upgrade head
          python -m app.seed --profile demo
      - name: Run backend (background)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          sleep 12
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: E2E (Playwright, system Chrome, 1440×900 视觉基线)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
