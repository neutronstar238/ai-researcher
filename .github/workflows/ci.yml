name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run ruff
        run: poetry run ruff check src tests

      - name: Run mypy
        run: poetry run mypy src

      - name: Run repository-contained tests
        run: >-
          poetry run pytest
          tests/smoke/test_cli.py
          tests/unit/agents
          tests/unit/api
          tests/unit/cli
          tests/unit/config
          tests/unit/evidence
          tests/unit/kernel
          tests/unit/knowledge
          tests/unit/literature
          tests/unit/llm
          tests/unit/observability
          tests/unit/schemas
          tests/unit/competition/test_contest_direct_plan.py
          tests/unit/competition/test_contest_direct_plan_render.py
          tests/unit/competition/test_contest_direct_plan_revision.py
          tests/unit/competition/test_contest_direction_literature.py
          tests/unit/competition/test_contest_direction_skill_evolution.py
          tests/unit/research/test_adaptive_capabilities.py
          tests/unit/research/test_plans.py
